<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#091321" />
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem('pointline-theme-v1') === 'light' ? 'light' : 'dark';
      } catch {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <title>Pointline — PI planning estimates</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app" class="app-shell"></div>

    <div id="modal-root"></div>
    <script src="lucide.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
