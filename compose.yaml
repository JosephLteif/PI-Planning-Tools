services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - pointline-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  pointline:
    build: .
    image: pointline:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POINTLINE_BOOTSTRAP_ADMIN_USERNAME: ${POINTLINE_BOOTSTRAP_ADMIN_USERNAME:?required}
      POINTLINE_BOOTSTRAP_ADMIN_PASSWORD: ${POINTLINE_BOOTSTRAP_ADMIN_PASSWORD:?required}
      DATABASE_URL: ${DATABASE_URL:?required}
    ports:
      - "${POINTLINE_PORT:-8787}:8787"
    restart: unless-stopped

volumes:
  pointline-postgres-data:
